name: NOBRE SERVICOS V4.12 - GERAR APK CORRIGIDO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Corrigir app antes de compilar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path("src/main/assets/app.js")
          idx_path = Path("src/main/assets/index.html")
          java_path = Path("src/main/java/com/nobreflorestal/inventario/MainActivity.java")
          gradle_path = Path("build.gradle")

          js = js_path.read_text(encoding="utf-8", errors="ignore")
          marker = "const $=id=>document.getElementById(id);"

          if "function isAndroidApp()" not in js:
              js = js.replace(marker, marker + r'''
          function isAndroidApp(){
            try{
              const qs=new URLSearchParams(window.location.search||'');
              return qs.get('android')==='1' || !!window.AndroidBridge;
            }catch(_){
              return !!window.AndroidBridge;
            }
          }
          ''', 1)

          if "function loadPreviewData()" not in js:
              js = js.replace(marker, marker + "\nfunction loadPreviewData(){ return false; }\n", 1)

          if "__nobreNavFallbackV412" not in js:
              js = js.replace(marker, marker + r'''
          (function(){
            if(window.__nobreNavFallbackV412)return;
            window.__nobreNavFallbackV412=true;

            document.addEventListener('click',function(e){
              try{
                const go=e.target?.closest?.('[data-go]');
                if(go){
                  e.preventDefault();
                  goScreen(go.dataset.go);
                  return;
                }
                const sync=e.target?.closest?.('#navSync,#syncBtn');
                if(sync){
                  e.preventDefault();
                  if(typeof fastRefreshV45==='function') fastRefreshV45(true);
                  else if(typeof refreshCloud==='function') refreshCloud(true);
                  return;
                }
                const more=e.target?.closest?.('#navMore,#settingsBtn');
                if(more){
                  e.preventDefault();
                  if(typeof openSettings==='function') openSettings();
                }
              }catch(err){ console.warn('Fallback V4.12:',err); }
            },true);

            setTimeout(function(){
              try{
                if(typeof startCloudTimer==='function') startCloudTimer();
                if(navigator.onLine && typeof fastRefreshV45==='function') fastRefreshV45(false);
              }catch(err){ console.warn('Sync V4.12:',err); }
            },1200);
          })();
          ''', 1)

          js = js.replace("schemaVersion:45,", "schemaVersion:412,", 1)
          js_path.write_text(js, encoding="utf-8")

          idx = idx_path.read_text(encoding="utf-8", errors="ignore")
          idx = re.sub(r"styles\.css\?v=\d+", "styles.css?v=412", idx)
          idx = re.sub(r"app\.js\?v=\d+", "app.js?v=412", idx)
          idx = re.sub(r"Versão Android [^<]+", "Versão Android 4.12 • botões + sync corrigidos • offline", idx)
          idx_path.write_text(idx, encoding="utf-8")

          java = java_path.read_text(encoding="utf-8", errors="ignore")
          java = re.sub(r'index\.html\?android=1&build=\d+', 'index.html?android=1&build=412', java)
          anchor = "s.setDomStorageEnabled(true);"
          if anchor in java and "WebSettings.LOAD_NO_CACHE" not in java:
              java = java.replace(anchor, anchor + "\n        s.setCacheMode(WebSettings.LOAD_NO_CACHE);\n        webView.clearCache(true);", 1)
          java_path.write_text(java, encoding="utf-8")

          gradle = gradle_path.read_text(encoding="utf-8")
          gradle = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 27", gradle)
          gradle = re.sub(r"versionName\s*=\s*'[^']+'", "versionName = '4.12'", gradle)
          gradle_path.write_text(gradle, encoding="utf-8")

          print("V4.12 aplicada no código que será compilado.")
          PY

      - name: Conferir JavaScript corrigido
        run: |
          node --check src/main/assets/app.js
          grep -n "function isAndroidApp" src/main/assets/app.js
          grep -n "function loadPreviewData" src/main/assets/app.js
          grep -n "__nobreNavFallbackV412" src/main/assets/app.js

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Gerar APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          APK_PATH="$(find build -type f -name '*.apk' | head -n 1)"
          echo "APK encontrado: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            exit 1
          fi
          cp "$APK_PATH" NOBRE_SERVICOS_V4_12.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOBRE-SERVICOS-V4-12
          path: NOBRE_SERVICOS_V4_12.apk
