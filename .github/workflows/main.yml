name: NOBRE SERVICOS V4.13 - SYNC RAPIDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Aplicar V4.13 no app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path=Path("src/main/assets/app.js")
          idx_path=Path("src/main/assets/index.html")
          css_path=Path("src/main/assets/styles.css")
          java_path=Path("src/main/java/com/nobreflorestal/inventario/MainActivity.java")
          gradle_path=Path("build.gradle")

          js=js_path.read_text(encoding="utf-8",errors="ignore")
          idx=idx_path.read_text(encoding="utf-8",errors="ignore")
          css=css_path.read_text(encoding="utf-8",errors="ignore")
          java=java_path.read_text(encoding="utf-8",errors="ignore")
          gradle=gradle_path.read_text(encoding="utf-8",errors="ignore")

          # Garante correções anteriores de inicialização.
          marker="const $=id=>document.getElementById(id);"
          if "function isAndroidApp()" not in js:
              js=js.replace(marker,marker+r'''
          function isAndroidApp(){
            try{
              const qs=new URLSearchParams(window.location.search||'');
              return qs.get('android')==='1'||!!window.AndroidBridge;
            }catch(_){return !!window.AndroidBridge;}
          }
          ''',1)
          if "function loadPreviewData()" not in js:
              js=js.replace(marker,marker+"\nfunction loadPreviewData(){ return false; }\n",1)

          # Remove Sincronizar e Mais SOMENTE da barra inferior.
          idx=re.sub(r'\s*<button id="navSync">[\s\S]*?</button>','',idx,count=1)
          idx=re.sub(r'\s*<button id="navMore">[\s\S]*?</button>','',idx,count=1)

          if "V4.13 — BARRA INFERIOR LIMPA" not in css:
              css += r'''
          /* ===== V4.13 — BARRA INFERIOR LIMPA ===== */
          .bottom-nav{grid-template-columns:repeat(3,1fr)!important;}
          @media(max-width:700px){
            .bottom-nav{grid-template-columns:repeat(3,1fr)!important;}
          }
          '''

          js=re.sub(r"CLOUD_INTERVAL_MS=\d+","CLOUD_INTERVAL_MS=1000",js,count=1)
          js=js.replace("now-__nobreLastSyncV45<1200","now-__nobreLastSyncV45<450")

          old="$('syncBtn').onclick=()=>refreshCloud(true);$('navSync').onclick=()=>refreshCloud(true);$('settingsBtn').onclick=openSettings;$('navMore').onclick=openSettings;"
          new="if($('syncBtn'))$('syncBtn').onclick=()=>fastRefreshV45(true);if($('settingsBtn'))$('settingsBtn').onclick=openSettings;"
          js=js.replace(old,new,1)
          js=js.replace(
            "if($('navSync'))$('navSync').onclick=()=>fastRefreshV45(true);",
            "",1
          )
          js=js.replace(
            "if($('navMore'))$('navMore').onclick=openSettings;",
            "",1
          )
          js=js.replace(
            "$('filterMapBtn').onclick=openFilters;$('filterTreesBtn').onclick=openFilters;",
            "if($('filterMapBtn'))$('filterMapBtn').onclick=openFilters;if($('filterTreesBtn'))$('filterTreesBtn').onclick=openFilters;",
            1
          )

          start=js.find("async function refreshCloud(show=true){")
          end=js.find("\nasync function loadBundledInitial()",start)
          if start<0 or end<0:
              raise SystemExit("refreshCloud não encontrada")

          refresh=r'''async function refreshCloud(show=true){
            const cfg=getSettings();
            if(!cfg.apiUrl||!cfg.syncKey){
              if(show)showToast('Sincronização automática ainda não configurada.');
              return;
            }
            if(!navigator.onLine){
              if(show)showToast('Sem internet. Os mapas continuam disponíveis offline.');
              return;
            }
            try{
              const r=await jsonp(cfg.apiUrl,{key:cfg.syncKey,_t:Date.now()});
              if(!r?.ok||!r.payload){
                if(show)showToast('Ainda não há atualização do PC.');
                return;
              }

              const remoteMs=r.updatedAt?new Date(r.updatedAt).getTime():0;
              const rawPayload=String(r.payload||'');
              const sig=[String(r.updatedAt||''),rawPayload.length,rawPayload.slice(0,64),rawPayload.slice(-64)].join('|');
              const lastMs=Number(localStorage.getItem('nobre-cloud-ms-v413')||0);
              const lastSig=localStorage.getItem('nobre-cloud-sig-v413')||'';

              const shouldApply=!allTrees.length||!lastSig||sig!==lastSig||(remoteMs>0&&remoteMs>lastMs);
              if(!shouldApply){
                if(show)showToast('Você já está com a versão mais recente.');
                return;
              }

              const decoded=await decodeCloud({encoding:r.encoding,payload:r.payload});
              if(decoded?.syncConfig?.apiUrl&&decoded?.syncConfig?.syncKey){
                try{
                  localStorage.setItem('nobre-inventario-settings',JSON.stringify({
                    apiUrl:String(decoded.syncConfig.apiUrl).trim(),
                    syncKey:String(decoded.syncConfig.syncKey).trim()
                  }));
                }catch(_){}
              }

              if(Array.isArray(decoded?.data)){
                await applyMobileMapsFromPayload(decoded,true);
                await setData(decoded.data,decoded.updatedAt||r.updatedAt||new Date().toISOString(),decoded.source||'Nuvem PC ↔ celular',true,decoded.project||null,null);
                await saveLocal(buildPayload());
              }

              localStorage.setItem('nobre-cloud-ms-v413',String(remoteMs||Date.now()));
              localStorage.setItem('nobre-cloud-sig-v413',sig);
              if(show)showToast('Atualização do PC recebida.');
            }catch(e){
              console.warn('Sincronização rápida V4.13:',e);
              if(show)showToast('Não foi possível buscar a atualização.');
            }
          }'''
          js=js[:start]+refresh+js[end:]

          # Atualiza imediatamente quando volta ao app.
          bind=js.find("function bindEvents(){")
          if bind>=0 and "window.addEventListener('focus',()=>fastRefreshV45(false));" not in js:
              p=js.find("\n",js.find("window.addEventListener('online'",bind))
              if p>=0:
                  js=js[:p+1]+"  window.addEventListener('focus',()=>fastRefreshV45(false));\n  window.addEventListener('pageshow',()=>fastRefreshV45(false));\n"+js[p+1:]

          js=js.replace("schemaVersion:412,","schemaVersion:413,",1)
          js=js.replace("schemaVersion:45,","schemaVersion:413,",1)

          idx=re.sub(r"styles\.css\?v=\d+","styles.css?v=413",idx)
          idx=re.sub(r"app\.js\?v=\d+","app.js?v=413",idx)
          idx=re.sub(r"Versão Android [^<]+","Versão Android 4.13 • sync rápida • barra inferior limpa",idx)
          java=re.sub(r'index\.html\?android=1&build=\d+','index.html?android=1&build=413',java)
          gradle=re.sub(r"versionCode\s*=\s*\d+","versionCode = 28",gradle)
          gradle=re.sub(r"versionName\s*=\s*'[^']+'","versionName = '4.13'",gradle)

          js_path.write_text(js,encoding="utf-8")
          idx_path.write_text(idx,encoding="utf-8")
          css_path.write_text(css,encoding="utf-8")
          java_path.write_text(java,encoding="utf-8")
          gradle_path.write_text(gradle,encoding="utf-8")
          print("V4.13 aplicada.")
          PY

      - name: Conferir JavaScript
        run: node --check src/main/assets/app.js

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Gerar APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          APK_PATH="$(find build -type f -name '*.apk' | head -n 1)"
          echo "APK encontrado: $APK_PATH"
          if [ -z "$APK_PATH" ]; then exit 1; fi
          cp "$APK_PATH" NOBRE_SERVICOS_V4_13.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOBRE-SERVICOS-V4-13
          path: NOBRE_SERVICOS_V4_13.apk
