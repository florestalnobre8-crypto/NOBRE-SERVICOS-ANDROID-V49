name: NOBRE SERVICOS V4.17 - ERRO CORRIGIDO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Corrigir inicializacao do app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          js_path = Path("src/main/assets/app.js")
          idx_path = Path("src/main/assets/index.html")
          java_path = Path("src/main/java/com/nobreflorestal/inventario/MainActivity.java")
          gradle_path = Path("build.gradle")

          js = js_path.read_text(encoding="utf-8", errors="ignore")
          core = base64.b64decode("").decode("utf-8")

          if "/* ===== V4.17 — BLOCO PRINCIPAL RESTAURADO ===== */" not in js:
              pos = js.find("const mapState=")
              if pos < 0:
                  raise SystemExit("ERRO: mapState nao encontrado.")
              js = js[:pos] + core + "\n" + js[pos:]

          # Evita que versões antigas continuem carregando JS em cache.
          idx = idx_path.read_text(encoding="utf-8", errors="ignore")
          idx = re.sub(r"app\.js\?v=\d+", "app.js?v=417", idx)
          idx = re.sub(r"styles\.css\?v=\d+", "styles.css?v=417", idx)
          idx = re.sub(r"Versão Android [^<]+",
                       "Versão Android 4.17 • erro corrigido • sync ativa", idx)

          java = java_path.read_text(encoding="utf-8", errors="ignore")
          java = re.sub(r"index\.html\?android=1&build=\d+",
                        "index.html?android=1&build=417", java)

          gradle = gradle_path.read_text(encoding="utf-8", errors="ignore")
          gradle = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 32", gradle)
          gradle = re.sub(r"versionName\s*=\s*'[^']+'",
                          "versionName = '4.17'", gradle)

          js_path.write_text(js, encoding="utf-8")
          idx_path.write_text(idx, encoding="utf-8")
          java_path.write_text(java, encoding="utf-8")
          gradle_path.write_text(gradle, encoding="utf-8")

          print("V4.17 aplicada: bloco principal restaurado.")
          PY

      - name: Conferir JavaScript
        run: |
          node --check src/main/assets/app.js
          grep -n "function renderHomeSearch" src/main/assets/app.js
          grep -n "function renderKpis" src/main/assets/app.js
          grep -n "let mapLabelsVisible" src/main/assets/app.js

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Gerar APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          APK_PATH="$(find build -type f -name '*.apk' | head -n 1)"
          echo "APK encontrado: $APK_PATH"
          if [ -z "$APK_PATH" ]; then exit 1; fi
          cp "$APK_PATH" NOBRE_SERVICOS_V4_17.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOBRE-SERVICOS-V4-17
          path: NOBRE_SERVICOS_V4_17.apk
